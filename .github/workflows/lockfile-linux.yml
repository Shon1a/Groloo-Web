# TEMPORARY, MANUAL-ONLY. Regenerates package-lock.json on Linux and uploads it as an
# artifact so it can be committed from a Windows dev machine.
#
# Why this exists: `npm ci` on ubuntu rejects a lockfile generated on Windows, because
# npm records optional platform-specific dependencies only for platforms it resolved on.
# The @emnapi/* packages are optional deps of a wasm fallback binding that Linux resolves
# and Windows does not, so they are absent from a Windows-authored lockfile and `npm ci`
# treats that as out-of-sync. Regenerating on Windows cannot fix it by definition.
#
# Delete this file once the lockfile is committed. It is workflow_dispatch only, so it
# never runs on a push.
name: Lockfile (Linux)

# push-scoped to this one branch rather than workflow_dispatch: GitHub only offers manual
# dispatch for workflows that already exist on the DEFAULT branch, and putting a throwaway
# job on main to fix a branch is the wrong trade.
on:
  push:
    branches: [phase0/store-blockers]

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # --package-lock-only: resolve and write the lockfile without installing anything.
      - run: npm install --package-lock-only

      - run: git --no-pager diff --stat package-lock.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock-linux
          path: package-lock.json
