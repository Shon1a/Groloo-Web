<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/groloo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- API origin resolves automatically (localhost → same-origin, else Render).
         Override here or with VITE_API_BASE if the backend moves. -->
    <title>GROLOO — Your Personal Media Library</title>
    <!-- warm up external origins before the requests are made -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <!-- The trailer embed's origin, warmed here rather than at mount. A preview costs a DNS
         lookup and a TLS handshake to YouTube before a single byte of video moves, and on a TV
         — modest CPU, often wifi — that handshake is not free. It is paid once, up front, off
         the critical path, instead of inside the wait the viewer is actually sitting through.
         Harmless when no trailer is ever shown: an unused preconnect is dropped after ~10s. -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin />
    <!-- Poppins is the primary UI face, self-hosted in six weights; Inter covers Cyrillic and
         BPG Nino Mtavruli (also self-hosted) covers ქართული. The full reasoning for that stack,
         and why Inter is still in it, is on --font in app.css.

         FOUR OF THE SIX WEIGHTS ARE PRELOADED, and only the `latin` subset of each. `font-display:
         swap` means a face that has not arrived paints in the fallback and re-renders when it
         lands, so every weight left to load on its own is another moment the page reflows — but
         preloading all twelve files would spend the first screen's bandwidth on faces it does not
         use. These four are what actually paints above the fold on every route: 400 is the body,
         600 the nav and section titles, 300 the page heading, 700 the badges and ratings.

         800 (hero titles, home only) and every `latin-ext` file are deliberately left out: the
         ext subset carries accented Latin, which most screens never show, and its unicode-range
         means the browser will not fetch it unless a glyph needs it. -->
    <link rel="preload" href="/assets/fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/poppins-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/poppins-300-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/poppins-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- THE ქართული FACE IS PRELOADED ONLY FOR SOMEONE WHO HAS CHOSEN A LANGUAGE, and it is the
         one entry in this list that could not be justified by the rule above it. Measured on the
         TV build's English home screen, this file was fetched on every cold start — a preload
         overrides the `unicode-range` on its @font-face, which is the mechanism that would
         otherwise have skipped it, so the bytes were spent on the first screen for a face with no
         glyph anywhere on it. Small (6.6 KB), but it is bandwidth taken from the artwork during
         the exact moment the home screen is filling in, on a device that is often on wifi.

         NOBODY LOSES THE PRELOAD WHO WAS USING IT. `sf-lang` is unset until a language is picked
         (see i18n.tsx), and until then the UI is English — so the only load this skips is one with
         no Georgian on screen to flash. Pick ქართული and every load from then on preloads exactly
         as before. The check is deliberately "not English" rather than a list of Georgian codes:
         the language list comes from the translations repo at runtime, so this file cannot know
         what Georgian is called there, and being wrong in this direction costs one 6.6 KB fetch
         while being wrong in the other costs a visible reflow.

         Inline and synchronous so the link still lands in the head before the parser reaches the
         stylesheet — a deferred injection would be a preload that arrives after the request it
         was meant to get ahead of. `script-src 'unsafe-inline'` is already granted in
         vercel.json for the media-query swap on the line below. -->
    <script>
      try {
        if ((localStorage.getItem('sf-lang') || 'en') !== 'en') {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2';
          l.crossOrigin = 'anonymous';
          l.href = '/assets/fonts/bpg-nino-mtavruli.woff2';
          document.head.appendChild(l);
        }
      } catch (e) { /* storage denied — English default, no preload, unicode-range still covers it */ }
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
