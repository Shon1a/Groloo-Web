<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/groloo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- API origin resolves automatically (localhost → same-origin, else Render).
         Override here or with VITE_API_BASE if the backend moves. -->
    <title>GROLOO — Your Personal Media Library</title>
    <!-- warm up external origins before the requests are made -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <!-- The trailer embed's origin, warmed here rather than at mount. A preview costs a DNS
         lookup and a TLS handshake to YouTube before a single byte of video moves, and on a TV
         — modest CPU, often wifi — that handshake is not free. It is paid once, up front, off
         the critical path, instead of inside the wait the viewer is actually sitting through.
         Harmless when no trailer is ever shown: an unused preconnect is dropped after ~10s. -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin />
    <!-- Groloo is the primary UI face, self-hosted in three weights; Inter covers Cyrillic and
         BPG Nino Mtavruli (also self-hosted) covers ქართული. The full reasoning for that stack,
         and why Inter is still in it, is on --font in app.css.

         ALL THREE WEIGHTS ARE PRELOADED, not just the body one. `font-display: swap` means every
         face that has not arrived paints in the fallback first and re-renders when it lands — so
         loading them piecemeal is not one flash of unstyled text but three, at whatever moment
         each file happens to arrive. They are 21 kB each from our own origin, already-warm
         connection, and between them they cover the first screen: Medium is the body, Light is
         the display heading at the top of every page, and Bold is the hero title and every badge
         on the home rows. -->
    <link rel="preload" href="/assets/fonts/groloo-medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/groloo-light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/groloo-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/bpg-nino-mtavruli.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
